name: Rust Core CI

on:
  push:
  pull_request:

jobs:
  rust-core:
    name: Format, lint, and test default workspace
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint default members
        run: cargo clippy --all-targets -- -D warnings

      - name: Lint operator crates
        run: cargo clippy -p patina-llm -p patina-tui --all-targets -- -D warnings

      - name: Test default members
        run: cargo test --all-targets

      - name: Test operator crates
        run: cargo test -p patina-llm -p patina-tui --all-targets
